name: notify-dingtalk

on:
  workflow_call:
    secrets:
      DING_TALK_TOKEN:
        required: true
      NEXFORM_MEMBERS_JSON:
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: nexform-tech/workflows
          path: workflows
          sparse-checkout: scripts

      - name: Send
        env:
          DING_TOKEN: ${{ secrets.DING_TALK_TOKEN }}
          MEMBERS_JSON: ${{ secrets.NEXFORM_MEMBERS_JSON }}
          GH_TOKEN: ${{ github.token }}
        run: python3 workflows/scripts/notify_dingtalk.py
